name: Kalan Gün 1.8 yayın testi
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.8.yml', '.github/scripts/default_calendar_smoke.py']
  workflow_dispatch:
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Yayın paketini doğrula
        run: |
          echo '9fe0f9fa682005a257774a99f66d0e79c2c64b832e07d362662bb6a09164a0d0  download/Kalan-Gun.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify download/Kalan-Gun.apk
      - name: Emülatör hızlandırmasını etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r download/Kalan-Gun.apk
            python3 .github/scripts/default_calendar_smoke.py
      - name: APK yayımla ve tekrar indirerek doğrula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.8 >/dev/null 2>&1; then
            (cd download && zip -X ../Kalan-Gun-1.8.zip Kalan-Gun.apk)
            gh release create v1.8 download/Kalan-Gun.apk Kalan-Gun-1.8.zip --target "$GITHUB_SHA" --title 'Kalan Gün 1.8' --notes 'Etkinlikleri varsayılan takviminizde görüntüleyip oluşturabilirsiniz. Assets bölümünden Kalan-Gun.apk dosyasını indirin.'
          fi
          gh release download v1.8 --pattern Kalan-Gun.apk --dir "$RUNNER_TEMP"
          cmp download/Kalan-Gun.apk "$RUNNER_TEMP/Kalan-Gun.apk"
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.8/Kalan-Gun-1.8.zip" -o "$RUNNER_TEMP/release.zip"
          unzip -p "$RUNNER_TEMP/release.zip" Kalan-Gun.apk | cmp - download/Kalan-Gun.apk
