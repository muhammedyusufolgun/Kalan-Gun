name: Kalan Gün APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle clean testReleaseUnitTest assembleRelease
      - name: İmzaya hazır paketi kaydet
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - name: Yayın imzasını ve paket içeriğini doğrula
        if: ${{ github.ref == 'refs/heads/main' && hashFiles('download/Kalan-Gun.apk') != '' }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs download/Kalan-Gun.apk | tee signer.txt
          grep -Fq 'certificate SHA-256 digest: 8490fcc71ca13d47e6a4996599327a4181b2dc7f233f1c5301ab4d22d372d23f' signer.txt
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging download/Kalan-Gun.apk > package.txt
          grep -q "^package: name='tr.olgun.kalangun'" package.txt
          if grep -q '^application-debuggable' package.txt; then exit 1; fi
          "$aapt" dump permissions download/Kalan-Gun.apk | grep "^uses-permission:" > permissions.txt
          test "$(cat permissions.txt)" = "uses-permission: name='android.permission.READ_CALENDAR'"
          sha256sum download/Kalan-Gun.apk >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import glob, hashlib, zipfile
          def contents(path):
              with zipfile.ZipFile(path) as apk:
                  return {n: hashlib.sha256(apk.read(n)).digest() for n in apk.namelist()
                          if n != 'META-INF/version-control-info.textproto'}
          assert contents(glob.glob('build/outputs/apk/release/*-unsigned.apk')[0]) == contents('download/Kalan-Gun.apk'), 'Yayın APK içeriği derlemeyle eşleşmiyor'
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ github.ref == 'refs/heads/main' && hashFiles('download/Kalan-Gun.apk') != '' }}
        with:
          name: Kalan-Gun
          path: download/Kalan-Gun.apk
