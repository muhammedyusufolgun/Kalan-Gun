name: Kalan Gün APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug
      - run: |
          cp build/outputs/apk/debug/*.apk Kalan-Gun.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Kalan-Gun.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalan-Gun
          path: Kalan-Gun.apk
